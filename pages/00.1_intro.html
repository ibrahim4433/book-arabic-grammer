<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8"/>
    <title>مُقَدِّمَةُ الْكِتَابِ</title>
    <style>
        /* 1. Tell the PDF engine explicitly to make an A4 page with zero margins */
        @page {
            size: A4 portrait;
            margin: 0; 
        }

        /* 2. Strip all default web spacing */
        html, body {
            margin: 0;
            padding: 0;
            background-color: white;
        }

        /* 3. Force the image to match the exact physical dimensions of A4 paper */
        .intro-image {
            width: 210mm;
            height: 297mm;
            display: block;
            object-fit: contain; /* Keeps the text aspect ratio perfect */
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <img src="intro.png" alt="مقدمة الكتاب" class="intro-image">
</body>
</html>
