<div class="split-grid mb-1mm w-full">
  <div id="[UNIQUE_ID_1]">
    <div class="bio-card" id="[UNIQUE_ID_2]">
      <div class="bio-image-container">
        <img alt="[POET_NAME]" class="poet-img" src="../input/integrated-pictures/pic_[LESSON_NUMBER].jpg"/>
      </div>
      <div class="bio-info p-0">
        <h4 class="m-0 text-dark">[POET_NAME]</h4>
        <p class="m-0 mt-1mm text-sm">[POET_DATES]</p>
        <ul class="structured-list mb-0">
          [POET_BIO_LIST]
        </ul>
      </div>
    </div>
  </div>
  <div id="[UNIQUE_ID_3]">
    <div class="content-block" id="[UNIQUE_ID_4]">
      <div class="block-header">
        <span>مَدْخَلٌ إِلَى النَّصِّ</span>
      </div>
      <div class="block-body p-0">
        <ul class="structured-list mb-0">
          [INTRO_LIST]
        </ul>
      </div>
    </div>
  </div>
</div>
<div class="poem-container" id="[UNIQUE_ID_5]">
  <div class="poem-verses m-0 p-0">
    [POEM_VERSES]
  </div>
</div>
