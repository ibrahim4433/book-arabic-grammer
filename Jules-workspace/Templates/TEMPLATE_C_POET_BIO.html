<!-- IF 1-PAGE MODE: replace this <section> tag with a <div> tag -->
<section class="bio-card" id="[UNIQUE_ID]">
    <div class="bio-image-container">
        <img src="../input/integrated-pictures/pic_[PAGE_NUMBER].jpg" alt="[POET_NAME]" class="poet-img" />
    </div>
    <div class="bio-info">
        <h4 class="m-0 text-dark">[POET_NAME]</h4>
        <p class="m-0 mt-1mm text-sm">[POET_BIO_TEXT]</p>
    </div>
</section>
