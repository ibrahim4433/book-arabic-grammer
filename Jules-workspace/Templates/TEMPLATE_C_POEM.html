<!-- IF 1-PAGE MODE: replace this <section> tag with a <div> tag -->
<section class="poem-container" id="[UNIQUE_ID]">
    <div class="block-header poem-header">
        <span>[POEM_TITLE]</span>
    </div>
    
    <!-- Verses -->
    <div class="poem-verses">
        <div class="poem-line">
            <span class="hemistich">[RIGHT_HEMISTICH]</span>
            <span class="hemistich">[LEFT_HEMISTICH]</span>
        </div>
        <!-- Alternative flex layout often used -->
        <div class="poem-line flex justify-between items-center mb-2mm">
            <div class="hemistich w-45pct text-center font-bold">[RIGHT_HEMISTICH]</div>
            <div class="hemistich w-45pct text-center font-bold">[LEFT_HEMISTICH]</div>
        </div>
    </div>
</section>
