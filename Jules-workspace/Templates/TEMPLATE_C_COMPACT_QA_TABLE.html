<!-- IF 1-PAGE MODE: replace this <section> tag with a <div> tag -->
<section class="content-block compact-qa" id="[UNIQUE_ID]">
    <div class="block-header">
        <span>[TABLE_TITLE]</span>
    </div>
    <div class="block-body p-0">
        <table class="dense-table w-full">
            <tbody>
                <!-- Repeat for each Q&A pair -->
                <tr>
                    <td class="font-bold w-30pct">[QUESTION]</td>
                    <td>[ANSWER]</td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
